<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Health & Treatment Tracking System</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --primary: #06b6d4;
      --primary-hover: #0891b2;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    header {
      background: #1e293b;
      padding: 20px 8%;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary);
    }

    .container {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 25px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    h2, h3 {
      color: var(--primary);
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: #fff;
      font-size: 0.95rem;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    button.btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #0f172a;
      font-weight: bold;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: 0.2s;
    }

    button.btn:hover {
      background: var(--primary-hover);
    }

    .search-box {
      margin-bottom: 20px;
    }

    .patient-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .patient-item {
      background: #0f172a;
      border-left: 4px solid var(--primary);
      padding: 15px;
      border-radius: 8px;
      position: relative;
    }

    .patient-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    .badge-ongoing {
      background: rgba(245, 158, 11, 0.2);
      color: #f59e0b;
    }

    .badge-recovered {
      background: rgba(16, 185, 129, 0.2);
      color: #10b981;
    }

    .badge-critical {
      background: rgba(239, 68, 68, 0.2);
      color: #ef4444;
    }

    .info-row {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .info-row strong {
      color: #fff;
    }

    .btn-delete {
      position: absolute;
      top: 15px;
      right: 15px;
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">🩺 MediTrack Pro</div>
    <p style="color: var(--text-muted); font-size: 0.9rem;">Patient Treatment System</p>
  </header>

  <div class="container">
    <div class="grid">
      
      <!-- Patient Form -->
      <div class="card">
        <h3>+ New Patient Record</h3>
        <form id="patientForm" onsubmit="savePatient(event)">
          <div class="form-group">
            <label>Patient Full Name</label>
            <input type="text" id="name" required placeholder="e.g. John Doe">
          </div>

          <div class="form-group">
            <label>Age & Gender</label>
            <div style="display: flex; gap: 10px;">
              <input type="number" id="age" required placeholder="Age" style="width: 45%;">
              <select id="gender" required style="width: 55%;">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Diagnosis / Health Issue</label>
            <input type="text" id="diagnosis" required placeholder="e.g. Hypertension, Fever">
          </div>

          <div class="form-group">
            <label>Treatment / Prescribed Medicines</label>
            <textarea id="treatment" required placeholder="Dosage, instructions, therapy..."></textarea>
          </div>

          <div class="form-group">
            <label>Treatment Status</label>
            <select id="status">
              <option value="Ongoing">Ongoing</option>
              <option value="Recovered">Recovered</option>
              <option value="Critical">Critical</option>
            </select>
          </div>

          <div class="form-group">
            <label>Next Follow-up Date</label>
            <input type="date" id="followUpDate">
          </div>

          <button type="submit" class="btn">Save Record</button>
        </form>
      </div>

      <!-- Patient Records List -->
      <div class="card">
        <h3>📋 Patient Tracking Dashboard</h3>
        
        <div class="search-box">
          <input type="text" id="search" placeholder="🔍 Search patient by name or illness..." onkeyup="filterPatients()">
        </div>

        <div id="patientList" class="patient-list">
          <!-- Dynamic records load here -->
        </div>
      </div>

    </div>
  </div>

  <script>
    let patients = JSON.parse(localStorage.getItem('patientsData')) || [];

    function savePatient(e) {
      e.preventDefault();

      const newRecord = {
        id: Date.now(),
        name: document.getElementById('name').value.trim(),
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        diagnosis: document.getElementById('diagnosis').value.trim(),
        treatment: document.getElementById('treatment').value.trim(),
        status: document.getElementById('status').value,
        date: document.getElementById('followUpDate').value || 'Not scheduled'
      };

      patients.unshift(newRecord);
      localStorage.setItem('patientsData', JSON.stringify(patients));

      document.getElementById('patientForm').reset();
      renderPatients(patients);
    }

    function deletePatient(id) {
      if(confirm('Are you sure you want to delete this patient record?')) {
        patients = patients.filter(p => p.id !== id);
        localStorage.setItem('patientsData', JSON.stringify(patients));
        renderPatients(patients);
      }
    }

    function filterPatients() {
      const term = document.getElementById('search').value.toLowerCase();
      const filtered = patients.filter(p => 
        p.name.toLowerCase().includes(term) || 
        p.diagnosis.toLowerCase().includes(term)
      );
      renderPatients(filtered);
    }

    function getBadgeClass(status) {
      if(status === 'Recovered') return 'badge-recovered';
      if(status === 'Critical') return 'badge-critical';
      return 'badge-ongoing';
    }

    function renderPatients(records) {
      const list = document.getElementById('patientList');
      list.innerHTML = '';

      if (records.length === 0) {
        list.innerHTML = '<p style="color: var(--text-muted); text-align: center;">No patient records found.</p>';
        return;
      }

      records.forEach(p => {
        const item = document.createElement('div');
        item.className = 'patient-item';
        item.innerHTML = `
          <button class="btn-delete" onclick="deletePatient(${p.id})">✕</button>
          <div class="patient-header">
            <h4>${p.name} (${p.age} yrs, ${p.gender})</h4>
            <span class="badge ${getBadgeClass(p.status)}">${p.status}</span>
          </div>
          <div class="info-row"><strong>Diagnosis:</strong> ${p.diagnosis}</div>
          <div class="info-row"><strong>Treatment:</strong> ${p.treatment}</div>
          <div class="info-row"><strong>Next Visit:</strong> ${p.date}</div>
        `;
        list.appendChild(item);
      });
    }

    // Initial render
    renderPatients(patients);
  </script>
</body>
</html>
